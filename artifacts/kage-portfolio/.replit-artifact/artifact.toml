kind = "web"
previewPath = "/"
title = "Kage Portfolio"
version = "1.0.0"
id = "artifacts/kage-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22783

[services.development]
run = "pnpm --filter @workspace/kage-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/kage-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/kage-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22783"
BASE_PATH = "/"
